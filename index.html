<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나만의 감성일기장</title>
  <!-- 감성 서체 로드 (고운바탕, 나눔명조, 개구쟁이 손글씨) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-desk: #efe9df;
      --paper-bg: #fcf9f2;
      --paper-line: #ebe3d5;
      --ink-main: #3d352e;
      --ink-sub: #7a6f64;
      --accent: #b88463;
      --accent-hover: #9f6d4e;
      --tape-color: rgba(219, 198, 169, 0.58);
      --border-soft: #e2d8c8;
      --shadow-paper: 0 10px 30px rgba(61, 53, 46, 0.08);
      --font-current: 'Gowun Batang', serif;
    }

    body.font-batang { --font-current: 'Gowun Batang', serif; }
    body.font-myeongjo { --font-current: 'Nanum Myeongjo', serif; }
    body.font-hand { --font-current: 'Gaegu', cursive; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-desk);
      background-image: radial-gradient(#dfd6c7 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--ink-main);
      font-family: var(--font-current);
      line-height: 1.75;
      min-height: 100vh;
      padding: 24px 16px 60px;
      transition: font-family 0.2s ease;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* 상단 헤더 */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding: 14px 20px;
      background: rgba(252, 249, 242, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(61, 53, 46, 0.04);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand span {
      font-size: 0.85rem;
      color: var(--ink-sub);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill-group {
      display: inline-flex;
      background: #f1eadf;
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
    }

    .pill-btn {
      border: none;
      background: transparent;
      padding: 5px 11px;
      font-size: 0.85rem;
      border-radius: 7px;
      cursor: pointer;
      color: var(--ink-sub);
      transition: all 0.15s ease;
    }

    .pill-btn.active {
      background: var(--paper-bg);
      color: var(--ink-main);
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .btn-ghost {
      background: var(--paper-bg);
      border: 1px solid var(--border-soft);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.84rem;
      cursor: pointer;
      color: var(--ink-sub);
      transition: 0.15s;
    }

    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--ink-main);
    }

    /* 메인 탭 네비게이션 */
    .view-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: rgba(252, 249, 242, 0.65);
      font-size: 1rem;
      cursor: pointer;
      color: var(--ink-sub);
      transition: 0.2s;
    }

    .tab-btn.active {
      background: var(--paper-bg);
      color: var(--ink-main);
      font-weight: 700;
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(61, 53, 46, 0.06);
    }

    /* 종이 노트 카드 */
    .paper-sheet {
      position: relative;
      background-color: var(--paper-bg);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 36px 32px 32px;
      box-shadow: var(--shadow-paper);
    }

    /* 마스킹 테이프 장식 */
    .masking-tape {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%) rotate(-1.5deg);
      width: 130px;
      height: 26px;
      background: var(--tape-color);
      border-left: 2px dashed rgba(255,255,255,0.4);
      border-right: 2px dashed rgba(255,255,255,0.4);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      pointer-events: none;
    }

    /* 메타 정보 행 */
    .meta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding-bottom: 18px;
      border-bottom: 1px dashed var(--border-soft);
      margin-bottom: 20px;
    }

    .field-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--ink-sub);
      margin-bottom: 6px;
    }

    input[type="date"],
    input[type="text"] {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-soft);
      padding: 6px 4px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="date"]:focus,
    input[type="text"]:focus {
      border-bottom-color: var(--accent);
    }

    /* 선택 칩 (날씨, 기분) */
    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border: 1px solid var(--border-soft);
      background: #f7f2e8;
      border-radius: 20px;
      padding: 4px 11px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: 0.15s;
    }

    .chip.selected {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .title-input {
      font-size: 1.3rem !important;
      font-weight: 700;
      margin-bottom: 22px;
      padding: 8px 4px !important;
    }

    /* 폴라로이드 사진 영역 */
    .photo-section {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-upload-box {
      width: 100%;
      border: 1.5px dashed var(--border-soft);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      color: var(--ink-sub);
      cursor: pointer;
      background: #faf6ed;
      transition: 0.2s;
    }

    .photo-upload-box:hover {
      border-color: var(--accent);
      background: #f6efe2;
    }

    .polaroid-frame {
      position: relative;
      background: #fff;
      padding: 12px 12px 32px;
      border: 1px solid #e6dfd3;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      transform: rotate(0.8deg);
      max-width: 340px;
      width: 100%;
      margin-top: 8px;
    }

    .polaroid-frame::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 90px;
      height: 20px;
      background: var(--tape-color);
    }

    .polaroid-frame img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      display: block;
      border-radius: 2px;
    }

    .photo-remove-btn {
      position: absolute;
      bottom: 6px;
      right: 12px;
      background: none;
      border: none;
      font-size: 0.8rem;
      color: #a65c5c;
      cursor: pointer;
    }

    /* 줄노트 본문 영역 */
    .lined-textarea {
      width: 100%;
      min-height: 250px;
      border: none;
      outline: none;
      resize: vertical;
      font-size: 1.05rem;
      line-height: 34px;
      padding: 4px 6px;
      background-color: transparent;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 33px,
        var(--paper-line) 34px
      );
      margin-bottom: 22px;
    }

    body.font-hand .lined-textarea {
      font-size: 1.25rem;
    }

    /* 하단 BGM & 한 줄 회고 */
    .extra-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background: #f7f2e7;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      margin-bottom: 24px;
    }

    /* 액션 버튼 */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 26px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(184, 132, 99, 0.25);
      transition: 0.15s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    /* 보관함 (목록 뷰) */
    .archive-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .archive-controls input,
    .archive-controls select {
      background: var(--paper-bg);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.95rem;
    }

    .archive-controls input {
      flex: 1;
      min-width: 200px;
    }

    .diary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .diary-card {
      background: var(--paper-bg);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 18px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(61, 53, 46, 0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .diary-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(61, 53, 46, 0.1);
      border-color: var(--accent);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--ink-sub);
      margin-bottom: 8px;
    }

    .card-thumb {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid var(--border-soft);
    }

    .card-title {
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-excerpt {
      font-size: 0.92rem;
      color: var(--ink-sub);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .card-footer {
      font-size: 0.8rem;
      color: var(--accent);
      border-top: 1px dashed var(--border-soft);
      padding-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--paper-bg);
      border: 1px dashed var(--border-soft);
      border-radius: 16px;
      color: var(--ink-sub);
    }

    /* 상세 보기 모달 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(40, 34, 28, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--paper-bg);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      max-width: 640px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .modal-content-text {
      white-space: pre-wrap;
      line-height: 1.85;
      margin: 18px 0;
      padding: 16px;
      background: #faf6ed;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #3d352e;
      color: #fcf9f2;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 640px) {
      .meta-row, .extra-grid {
        grid-template-columns: 1fr;
      }
      .paper-sheet {
        padding: 28px 18px 24px;
      }
    }
  </style>
</head>
<body class="font-batang">
  <div class="container">
    <!-- 상단 헤더 -->
    <header>
      <div class="brand">
        <h1>📖 나만의 감성일기장</h1>
        <span>브라우저 자동 보관</span>
      </div>

      <div class="toolbar">
        <!-- 서체 전환 -->
        <div class="pill-group" aria-label="서체 선택">
          <button type="button" class="pill-btn active" data-font="font-batang">바탕</button>
          <button type="button" class="pill-btn" data-font="font-myeongjo">명조</button>
          <button type="button" class="pill-btn" data-font="font-hand">손글씨</button>
        </div>

        <!-- 백업 / 복원 -->
        <button type="button" class="btn-ghost" id="btnExport" title="JSON 파일로 백업">백업 저장</button>
        <button type="button" class="btn-ghost" id="btnImport" title="백업 파일 불러오기">복원</button>
        <input type="file" id="importFileInput" accept=".json" class="hidden" />
      </div>
    </header>

    <!-- 뷰 전환 탭 -->
    <nav class="view-tabs">
      <button type="button" class="tab-btn active" id="tabWrite">✍️ 오늘의 일기 쓰기</button>
      <button type="button" class="tab-btn" id="tabArchive">🗂️ 일기 보관함 (<span id="diaryCount">0</span>)</button>
    </nav>

    <!-- 1. 일기 작성 / 수정 뷰 -->
    <main id="viewWrite" class="paper-sheet">
      <div class="masking-tape"></div>

      <input type="hidden" id="editingId" value="" />

      <div class="meta-row">
        <div class="field-group">
          <label for="diaryDate">날짜</label>
          <input type="date" id="diaryDate" />
        </div>

        <div class="field-group">
          <label>오늘의 날씨</label>
          <div class="chip-list" id="weatherChips">
            <button type="button" class="chip selected" data-val="☀️ 맑음">☀️ 맑음</button>
            <button type="button" class="chip" data-val="⛅ 구름">⛅ 구름</button>
            <button type="button" class="chip" data-val="🌧️ 비">🌧️ 비</button>
            <button type="button" class="chip" data-val="❄️ 눈">❄️ 눈</button>
            <button type="button" class="chip" data-val="🌙 고요한 밤">🌙 밤</button>
          </div>
        </div>
      </div>

      <div class="field-group" style="margin-bottom: 18px;">
        <label>오늘의 기분 스티커</label>
        <div class="chip-list" id="moodChips">
          <button type="button" class="chip selected" data-val="🌿 잔잔함">🌿 잔잔함</button>
          <button type="button" class="chip" data-val="😊 따뜻함">😊 따뜻함</button>
          <button type="button" class="chip" data-val="✨ 설렘">✨ 설렘</button>
          <button type="button" class="chip" data-val="☕ 나른함">☕ 나른함</button>
          <button type="button" class="chip" data-val="☁️ 센치함">☁️ 센치함</button>
          <button type="button" class="chip" data-val="🫧 지침">🫧 지침</button>
        </div>
      </div>

      <input type="text" id="diaryTitle" class="title-input" placeholder="오늘 하루를 한 줄 제목으로 남겨보세요..." />

      <!-- 사진 업로드 / 폴라로이드 미리보기 -->
      <div class="photo-section">
        <label for="photoInput" class="photo-upload-box" id="photoUploadLabel">
          📷 오늘의 한 컷 붙이기 (클릭하여 사진 선택 · 선택사항)
        </label>
        <input type="file" id="photoInput" accept="image/*" class="hidden" />

        <div class="polaroid-frame hidden" id="polaroidPreview">
          <img id="previewImg" src="" alt="오늘의 사진" />
          <button type="button" class="photo-remove-btn" id="btnRemovePhoto">사진 떼어내기 ✕</button>
        </div>
      </div>

      <!-- 본문 -->
      <textarea id="diaryContent" class="lined-textarea" placeholder="오늘 있었던 사소한 순간, 스쳐 간 생각들을 편하게 적어 내려가 보세요..."></textarea>

      <!-- BGM & 한 줄 회고 -->
      <div class="extra-grid">
        <div class="field-group">
          <label for="diaryBgm">🎵 오늘의 BGM</label>
          <input type="text" id="diaryBgm" placeholder="예: 잔나비 - 주저하는 연인들을 위해" />
        </div>
        <div class="field-group">
          <label for="diaryNote">🕯️ 작은 감사 / 내일의 다짐</label>
          <input type="text" id="diaryNote" placeholder="오늘 고마웠던 한 가지를 적어보세요" />
        </div>
      </div>

      <div class="action-bar">
        <button type="button" class="btn-ghost" id="btnResetForm">새 일기 작성 (초기화)</button>
        <button type="button" class="btn-primary" id="btnSaveDiary">일기 저장하기</button>
      </div>
    </main>

    <!-- 2. 일기 보관함 뷰 -->
    <section id="viewArchive" class="hidden">
      <div class="archive-controls">
        <input type="text" id="searchInput" placeholder="제목, 본문, BGM 키워드 검색..." />
        <select id="moodFilter">
          <option value="">모든 기분 보기</option>
          <option value="🌿 잔잔함">🌿 잔잔함</option>
          <option value="😊 따뜻함">😊 따뜻함</option>
          <option value="✨ 설렘">✨ 설렘</option>
          <option value="☕ 나른함">☕ 나른함</option>
          <option value="☁️ 센치함">☁️ 센치함</option>
          <option value="🫧 지침">🫧 지침</option>
        </select>
      </div>

      <div id="diaryGrid" class="diary-grid"></div>
    </section>
  </div>

  <!-- 일기 상세 보기 모달 -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center; color:var(--ink-sub); font-size:0.9rem; margin-bottom:8px;">
        <span id="modalMeta"></span>
        <button type="button" class="btn-ghost" id="btnCloseModal">닫기 ✕</button>
      </div>
      <h2 id="modalTitle" style="font-size:1.35rem; margin-bottom:14px;"></h2>

      <div id="modalPhotoWrap" class="hidden" style="display:flex; justify-content:center; margin-bottom:16px;">
        <div class="polaroid-frame" style="transform: rotate(-0.5deg);">
          <img id="modalPhoto" src="" alt="첨부 사진" />
        </div>
      </div>

      <div id="modalContent" class="modal-content-text"></div>

      <div id="modalExtras" style="font-size:0.9rem; color:var(--ink-sub); margin-bottom:20px; line-height:1.8;"></div>

      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button type="button" class="btn-ghost" id="btnDeleteDiary" style="color:#a65c5c; border-color:#e0baba;">삭제하기</button>
        <button type="button" class="btn-primary" id="btnEditDiary">수정하기</button>
      </div>
    </div>
  </div>

  <!-- 알림 토스트 -->
  <div class="toast" id="toast"></div>

  <script>
    (function () {
      const STORAGE_KEY = 'emotional_diary_entries_v1';
      const FONT_KEY = 'emotional_diary_font_v1';

      let entries = [];
      let currentPhotoData = '';
      let activeModalId = null;

      // DOM 요소
      const diaryDate = document.getElementById('diaryDate');
      const diaryTitle = document.getElementById('diaryTitle');
      const diaryContent = document.getElementById('diaryContent');
      const diaryBgm = document.getElementById('diaryBgm');
      const diaryNote = document.getElementById('diaryNote');
      const editingId = document.getElementById('editingId');

      const photoInput = document.getElementById('photoInput');
      const photoUploadLabel = document.getElementById('photoUploadLabel');
      const polaroidPreview = document.getElementById('polaroidPreview');
      const previewImg = document.getElementById('previewImg');

      const viewWrite = document.getElementById('viewWrite');
      const viewArchive = document.getElementById('viewArchive');
      const tabWrite = document.getElementById('tabWrite');
      const tabArchive = document.getElementById('tabArchive');
      const diaryCount = document.getElementById('diaryCount');
      const diaryGrid = document.getElementById('diaryGrid');

      const searchInput = document.getElementById('searchInput');
      const moodFilter = document.getElementById('moodFilter');

      const detailModal = document.getElementById('detailModal');
      const toastEl = document.getElementById('toast');

      // 토스트 메시지
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
      }

      // 오늘 날짜 YYYY-MM-DD
      function getTodayStr() {
        const now = new Date();
        const offset = now.getTimezoneOffset() * 60000;
        return new Date(now - offset).toISOString().split('T')[0];
      }

      // localStorage 로드 & 저장
      function loadEntries() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          entries = raw ? JSON.parse(raw) : [];
        } catch (e) {
          entries = [];
        }
        diaryCount.textContent = entries.length;
      }

      function persistEntries() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
          diaryCount.textContent = entries.length;
          return true;
        } catch (e) {
          alert('브라우저 저장 공간(localStorage)이 가득 찼습니다. 기존 일기를 백업한 뒤 일부 사진을 정리해 주세요.');
          return false;
        }
      }

      // 서체 설정
      function applyFont(fontClass) {
        document.body.className = fontClass;
        localStorage.setItem(FONT_KEY, fontClass);
        document.querySelectorAll('[data-font]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.font === fontClass);
        });
      }

      document.querySelectorAll('[data-font]').forEach(btn => {
        btn.addEventListener('click', () => applyFont(btn.dataset.font));
      });

      const savedFont = localStorage.getItem(FONT_KEY);
      if (savedFont) applyFont(savedFont);

      // 칩 선택 핸들러
      function setupChipGroup(containerId) {
        const container = document.getElementById(containerId);
        container.addEventListener('click', (e) => {
          const btn = e.target.closest('.chip');
          if (!btn) return;
          container.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
          btn.classList.add('selected');
        });
      }

      function setChipValue(containerId, val) {
        const container = document.getElementById(containerId);
        const chips = container.querySelectorAll('.chip');
        let matched = false;
        chips.forEach(c => {
          const isMatch = c.dataset.val === val;
          c.classList.toggle('selected', isMatch);
          if (isMatch) matched = true;
        });
        if (!matched && chips[0]) chips[0].classList.add('selected');
      }

      function getChipValue(containerId) {
        const selected = document.querySelector(`#${containerId} .chip.selected`);
        return selected ? selected.dataset.val : '';
      }

      setupChipGroup('weatherChips');
      setupChipGroup('moodChips');

      // 이미지 리사이즈 (localStorage 용량 최적화)
      function resizeImageToBase64(file, maxWidth = 720, quality = 0.78) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let w = img.width;
              let h = img.height;
              if (w > maxWidth) {
                h = Math.round((h * maxWidth) / w);
                w = maxWidth;
              }
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function updatePhotoUI(dataUrl) {
        currentPhotoData = dataUrl || '';
        if (currentPhotoData) {
          previewImg.src = currentPhotoData;
          polaroidPreview.classList.remove('hidden');
          photoUploadLabel.classList.add('hidden');
        } else {
          previewImg.src = '';
          polaroidPreview.classList.add('hidden');
          photoUploadLabel.classList.remove('hidden');
          photoInput.value = '';
        }
      }

      photoInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const compressed = await resizeImageToBase64(file);
          updatePhotoUI(compressed);
        } catch (err) {
          showToast('이미지를 불러오지 못했습니다.');
        }
      });

      document.getElementById('btnRemovePhoto').addEventListener('click', () => {
        updatePhotoUI('');
      });

      // 폼 초기화
      function resetForm() {
        editingId.value = '';
        diaryDate.value = getTodayStr();
        diaryTitle.value = '';
        diaryContent.value = '';
        diaryBgm.value = '';
        diaryNote.value = '';
        setChipValue('weatherChips', '☀️ 맑음');
        setChipValue('moodChips', '🌿 잔잔함');
        updatePhotoUI('');
        document.getElementById('btnSaveDiary').textContent = '일기 저장하기';
      }

      document.getElementById('btnResetForm').addEventListener('click', () => {
        resetForm();
        showToast('새 일기 작성 화면으로 초기화되었습니다.');
      });

      // 일기 저장
      document.getElementById('btnSaveDiary').addEventListener('click', () => {
        const title = diaryTitle.value.trim();
        const content = diaryContent.value.trim();

        if (!title && !content) {
          showToast('제목이나 일기 내용을 한 줄이라도 적어주세요.');
          diaryContent.focus();
          return;
        }

        const record = {
          id: editingId.value || 'diary_' + Date.now(),
          date: diaryDate.value || getTodayStr(),
          weather: getChipValue('weatherChips'),
          mood: getChipValue('moodChips'),
          title: title || '무제의 하루',
          content: content,
          bgm: diaryBgm.value.trim(),
          note: diaryNote.value.trim(),
          photo: currentPhotoData,
          updatedAt: new Date().toISOString()
        };

        const existingIdx = entries.findIndex(item => item.id === record.id);
        if (existingIdx > -1) {
          entries[existingIdx] = record;
        } else {
          entries.unshift(record);
        }

        // 날짜 최신순 정렬
        entries.sort((a, b) => b.date.localeCompare(a.date) || b.updatedAt.localeCompare(a.updatedAt));

        if (persistEntries()) {
          showToast(existingIdx > -1 ? '일기가 수정되었습니다 ✨' : '오늘의 일기가 저장되었습니다 📖');
          resetForm();
          switchTab('archive');
        }
      });

      // 탭 전환
      function switchTab(target) {
        if (target === 'write') {
          viewWrite.classList.remove('hidden');
          viewArchive.classList.add('hidden');
          tabWrite.classList.add('active');
          tabArchive.classList.remove('active');
        } else {
          viewWrite.classList.add('hidden');
          viewArchive.classList.remove('hidden');
          tabWrite.classList.remove('active');
          tabArchive.classList.add('active');
          renderArchive();
        }
      }

      tabWrite.addEventListener('click', () => switchTab('write'));
      tabArchive.addEventListener('click', () => switchTab('archive'));

      // 보관함 렌더링
      function renderArchive() {
        const keyword = searchInput.value.trim().toLowerCase();
        const mood = moodFilter.value;

        const filtered = entries.filter(item => {
          const matchMood = !mood || item.mood === mood;
          const matchKey = !keyword ||
            (item.title && item.title.toLowerCase().includes(keyword)) ||
            (item.content && item.content.toLowerCase().includes(keyword)) ||
            (item.bgm && item.bgm.toLowerCase().includes(keyword));
          return matchMood && matchKey;
        });

        diaryGrid.innerHTML = '';

        if (filtered.length === 0) {
          diaryGrid.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <p style="font-size:1.1rem; margin-bottom:6px;">아직 펼쳐볼 일기가 없어요.</p>
              <p style="font-size:0.9rem;">오늘의 작은 조각들을 첫 페이지에 기록해 보세요.</p>
            </div>
          `;
          return;
        }

        filtered.forEach(item => {
          const card = document.createElement('article');
          card.className = 'diary-card';
          card.innerHTML = `
            <div>
              <div class="card-top">
                <span>${item.date} · ${item.weather || ''}</span>
                <span>${item.mood || ''}</span>
              </div>
              ${item.photo ? `<img class="card-thumb" src="${item.photo}" alt="일기 사진" />` : ''}
              <h3 class="card-title">${escapeHtml(item.title)}</h3>
              <p class="card-excerpt">${escapeHtml(item.content || '(내용 없음)')}</p>
            </div>
            <div class="card-footer">
              ${item.bgm ? `🎵 ${escapeHtml(item.bgm)}` : '🕯️ 소중한 하루의 기록'}
            </div>
          `;
          card.addEventListener('click', () => openModal(item.id));
          diaryGrid.appendChild(card);
        });
      }

      searchInput.addEventListener('input', renderArchive);
      moodFilter.addEventListener('change', renderArchive);

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // 상세 보기 모달
      function openModal(id) {
        const item = entries.find(e => e.id === id);
        if (!item) return;
        activeModalId = id;

        document.getElementById('modalMeta').textContent = `${item.date} · ${item.weather} · ${item.mood}`;
        document.getElementById('modalTitle').textContent = item.title;
        document.getElementById('modalContent').textContent = item.content || '(작성된 본문이 없습니다.)';

        const photoWrap = document.getElementById('modalPhotoWrap');
        if (item.photo) {
          document.getElementById('modalPhoto').src = item.photo;
          photoWrap.classList.remove('hidden');
        } else {
          photoWrap.classList.add('hidden');
        }

        const extras = [];
        if (item.bgm) extras.push(`🎵 오늘의 BGM: ${item.bgm}`);
        if (item.note) extras.push(`🕯️ 작은 감사 / 다짐: ${item.note}`);
        document.getElementById('modalExtras').innerHTML = extras.map(escapeHtml).join('<br/>');

        detailModal.classList.add('open');
      }

      function closeModal() {
        detailModal.classList.remove('open');
        activeModalId = null;
      }

      document.getElementById('btnCloseModal').addEventListener('click', closeModal);
      detailModal.addEventListener('click', (e) => {
        if (e.target === detailModal) closeModal();
      });

      // 일기 삭제
      document.getElementById('btnDeleteDiary').addEventListener('click', () => {
        if (!activeModalId) return;
        if (!confirm('이 일기를 정말 삭제할까요? 삭제 후에는 되돌릴 수 없습니다.')) return;
        entries = entries.filter(e => e.id !== activeModalId);
        persistEntries();
        closeModal();
        renderArchive();
        showToast('일기가 삭제되었습니다.');
      });

      // 일기 수정 모드 진입
      document.getElementById('btnEditDiary').addEventListener('click', () => {
        const item = entries.find(e => e.id === activeModalId);
        if (!item) return;

        editingId.value = item.id;
        diaryDate.value = item.date;
        diaryTitle.value = item.title;
        diaryContent.value = item.content;
        diaryBgm.value = item.bgm || '';
        diaryNote.value = item.note || '';
        setChipValue('weatherChips', item.weather);
        setChipValue('moodChips', item.mood);
        updatePhotoUI(item.photo || '');

        document.getElementById('btnSaveDiary').textContent = '수정 내용 저장하기';
        closeModal();
        switchTab('write');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // JSON 백업 내보내기
      document.getElementById('btnExport').addEventListener('click', () => {
        if (entries.length === 0) {
          showToast('백업할 일기가 아직 없습니다.');
          return;
        }
        const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `감성일기장_백업_${getTodayStr()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('백업 파일(.json)이 다운로드되었습니다.');
      });

      // JSON 백업 복원
      const importFileInput = document.getElementById('importFileInput');
      document.getElementById('btnImport').addEventListener('click', () => {
        importFileInput.click();
      });

      importFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const imported = JSON.parse(ev.target.result);
            if (!Array.isArray(imported)) throw new Error('형식 오류');
            const map = new Map(entries.map(item => [item.id, item]));
            imported.forEach(item => {
              if (item && item.id && item.date) map.set(item.id, item);
            });
            entries = Array.from(map.values()).sort(
              (a, b) => b.date.localeCompare(a.date) || (b.updatedAt || '').localeCompare(a.updatedAt || '')
            );
            if (persistEntries()) {
              renderArchive();
              showToast(`총 ${entries.length}개의 일기가 복원되었습니다.`);
            }
          } catch (err) {
            alert('올바른 일기장 백업(.json) 파일이 아닙니다.');
          } finally {
            importFileInput.value = '';
          }
        };
        reader.readAsText(file);
      });

      // 초기 실행
      loadEntries();
      resetForm();
    })();
  </script>
</body>
</html>
